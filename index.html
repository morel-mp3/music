<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="morèl — songwriter, producer and performer.">
  <title>morèl</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <section id="home" class="page">

    <img
      src="assets/page-1.webp"
      alt="morèl"
    >

    <nav class="page-links" aria-label="Navigation">

      <a
        class="nav-about"
        href="#about"
        aria-label="About morèl"
      ></a>

      <a
        class="nav-live"
        href="#live"
        aria-label="Live"
      ></a>

      <a
        class="nav-contact"
        href="#contact"
        aria-label="Contact"
      ></a>

    </nav>

  </section>


  <!-- ABOUT -->
  <section id="about" class="page">

    <img
      src="assets/page-2.webp"
      alt="Who is morèl? Biography"
    >

    <nav class="page-links" aria-label="Navigation">

      <a
        class="nav-about"
        href="#about"
        aria-label="About morèl"
      ></a>

      <a
        class="nav-live"
        href="#live"
        aria-label="Live"
      ></a>

      <a
        class="nav-contact"
        href="#contact"
        aria-label="Contact"
      ></a>

    </nav>

    <a
      class="home-logo"
      href="#home"
      aria-label="Back to home"
    ></a>

  </section>


  <!-- LIVE -->
  <section id="live" class="page">

    <img
      src="assets/page-3.webp"
      alt="morèl live dates"
    >

    <nav class="page-links" aria-label="Navigation">

      <a
        class="nav-about"
        href="#about"
        aria-label="About morèl"
      ></a>

      <a
        class="nav-live"
        href="#live"
        aria-label="Live"
      ></a>

      <a
        class="nav-contact"
        href="#contact"
        aria-label="Contact"
      ></a>

    </nav>

    <a
      class="home-logo"
      href="#home"
      aria-label="Back to home"
    ></a>

  </section>


  <!-- CONTACT -->
  <section id="contact" class="page">

    <img
      src="assets/page-4.webp"
      alt="morèl contact and social media"
    >

    <nav class="page-links" aria-label="Navigation">

      <a
        class="nav-about"
        href="#about"
        aria-label="About morèl"
      ></a>

      <a
        class="nav-live"
        href="#live"
        aria-label="Live"
      ></a>

      <a
        class="nav-contact"
        href="#contact"
        aria-label="Contact"
      ></a>

    </nav>

    <a
      class="home-logo"
      href="#home"
      aria-label="Back to home"
    ></a>


    <!-- EMAIL -->
    <a
      class="contact-email"
      href="mailto:elinevaarzonmorel@live.nl"
      aria-label="Email morèl"
    ></a>


    <!-- MAILING LIST -->
    <a
      class="mailing-list"
      href="https://docs.google.com/forms/d/e/1FAIpQLSfJ-6jIdr_UfgFVSk1R5ropHOHxpCl81PEpbz-WifQzTBPfkg/viewform?usp=header"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Sign up for the mailing list"
    ></a>


    <!-- FACEBOOK -->
    <a
      class="social facebook"
      href="https://www.facebook.com/morelwastaken/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
    ></a>


    <!-- INSTAGRAM -->
    <a
      class="social instagram"
      href="https://www.instagram.com/morel.mp3/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    ></a>


    <!-- TIKTOK -->
    <a
      class="social tiktok"
      href="https://www.tiktok.com/@morel.mp3"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TikTok"
    ></a>

</html>
