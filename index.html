<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="morèl — songwriter, producer and performer.">
  <title>morèl</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="nav" aria-label="Main navigation">
    <a href="#home">home</a>
    <a href="#about">about</a>
    <a href="#live">live</a>
    <a href="#contact">contact</a>
  </nav>

  <main>

    <!-- HOME -->
    <section id="home" class="page home">

      <img
        class="home-photo"
        src="assets/asset-2.webp"
        alt=""
      >

      <img
        class="logo"
        src="assets/asset-7.webp"
        alt="morèl"
      >

      <img
        class="line home-line-1"
        src="assets/asset-6.webp"
        alt=""
      >

      <img
        class="line home-line-2"
        src="assets/asset-8.webp"
        alt=""
      >

      <img
        class="line home-line-3"
        src="assets/asset-9.webp"
        alt=""
      >

    </section>


    <!-- ABOUT -->
    <section id="about" class="page tiled-page about">

      <div class="tile-bg"></div>

      <img
        class="about-text"
        src="assets/asset-10.webp"
        alt="Who is morèl?"
      >

      <img
        class="about-line"
        src="assets/asset-12.webp"
        alt=""
      >

    </section>


    <!-- LIVE -->
    <section id="live" class="page tiled-page live">

      <div class="tile-bg"></div>

      <a
        class="live-video"
        href="https://www.youtube.com/watch?v=cksZPovuxDI"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Watch unfold my head live on YouTube"
      >
        <img
          src="assets/asset-17.webp"
          alt="unfold my head live"
        >
      </a>

      <img
        class="scribble"
        src="assets/asset-14.webp"
        alt=""
      >

      <img
        class="where-title"
        src="assets/asset-16.webp"
        alt="where do i play?"
      >

      <img
        class="show-list"
        src="assets/asset-15.webp"
        alt="Live dates"
      >

    </section>


    <!-- CONTACT -->
    <section id="contact" class="page contact">

      <img
        class="contact-photo"
        src="assets/asset-4.webp"
        alt=""
      >

      <img
        class="contact-art"
        src="assets/asset-13.webp"
        alt="Contact, mailing list and social media"
      >

      <a
        class="hotspot email"
        href="mailto:elinevaarzonmorel@live.nl"
        aria-label="Email morèl"
      ></a>

      <a
        class="hotspot mailing"
        href="https://docs.google.com/forms/d/e/1FAIpQLSfJ-6jIdr_UfgFVSk1R5ropHOHxpCl81PEpbz-WifQzTBPfkg/viewform?usp=header"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join mailing list"
      ></a>

      <a
        class="hotspot facebook"
        href="https://www.facebook.com/morelwastaken/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
      ></a>

      <a
        class="hotspot instagram"
        href="https://www.instagram.com/morel.mp3/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      ></a>

      <a
        class="hotspot tiktok"
        href="https://www.tiktok.com/@morel.mp3"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
      ></a>

    </section>

  </main>

</body>
</html>
