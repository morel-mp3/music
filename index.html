<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="morèl — singer-songwriter, producer and performer. Music, live dates and contact.">
  <title>morèl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="canvas">

    <!-- HERO -->
    <section class="hero">
      <img class="hero-photo" src="assets/asset-2.webp" alt="">
      <img class="logo" src="assets/asset-7.webp" alt="morèl">

      <img class="line line-a" src="assets/asset-6.webp" alt="">
      <img class="line line-b" src="assets/asset-8.webp" alt="">
      <img class="line line-c" src="assets/asset-9.webp" alt="">
    </section>

    <!-- ABOUT -->
    <section class="about">

      <img class="paper paper-about" src="assets/asset-3.webp" alt="">

      <img
        class="about-copy"
        src="assets/asset-10.webp"
        alt="Who is morèl?"
      >

      <img
        class="long-line"
        src="assets/asset-12.webp"
        alt=""
      >

      <a
        class="video-card"
        href="https://www.youtube.com/watch?v=cksZPovuxDI"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="video-title">unfold my head live</span>

        <img
          src="assets/asset-11.webp"
          alt="morèl performing live"
        >
      </a>

      <img
        class="scribble"
        src="assets/asset-14.webp"
        alt=""
      >

    </section>

    <!-- SHOWS -->
    <section class="shows">

      <img
        class="paper paper-shows"
        src="assets/asset-3.webp"
        alt=""
      >

      <img
        class="where-title"
        src="assets/asset-16.webp"
        alt="where do i play?"
      >

      <img
        class="show-list"
        src="assets/asset-15.webp"
        alt="Upcoming live dates"
      >

      <img
        class="lower-photo"
        src="assets/asset-4.webp"
        alt=""
      >

    </section>

    <!-- FOOTER -->
    <section class="footer">

      <img
        class="footer-art"
        src="assets/asset-13.webp"
        alt="Contact and social media"
      >

      <a
        class="click contact-link"
        href="mailto:elinevaarzonmorel@live.nl"
        aria-label="Email morèl"
      ></a>

      <a
        class="click mailing-link"
        href="https://docs.google.com/forms/d/e/1FAIpQLSfJ-6jIdr_UfgFVSk1R5ropHOHxpCl81PEpbz-WifQzTBPfkg/viewform?usp=header"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Mailing list"
      ></a>

      <a
        class="click facebook-link"
        href="https://www.facebook.com/morelwastaken/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
      ></a>

      <a
        class="click instagram-link"
        href="https://www.instagram.com/morel.mp3/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      ></a>

      <a
        class="click tiktok-link"
        href="https://www.tiktok.com/@morel.mp3"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
      ></a>

      <a
        class="click spotify-link"
        href="https://open.spotify.com/album/1DMOdYyyqKmSOXgGCnzivT?si=YAurKLoMSp-je8Zhze2u2A"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Spotify"
      ></a>

    </section>

  </main>

</body>
</html>
